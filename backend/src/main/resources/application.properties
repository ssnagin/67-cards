
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

# Redis replicas
app.replication.master-host=${REDIS_MASTER_HOST:localhost}
app.replication.master-port=${REDIS_MASTER_PORT:${REDIS_PORT:6379}}
app.replication.replica1-host=${REDIS_REPLICA1_HOST:localhost}
app.replication.replica1-port=${REDIS_REPLICA1_PORT:6380}
app.replication.replica2-host=${REDIS_REPLICA2_HOST:localhost}
app.replication.replica2-port=${REDIS_REPLICA2_PORT:6381}
app.replication.wait-timeout-ms=${REDIS_WAIT_TIMEOUT_MS:500}
app.replication.wait-replicas=${REDIS_WAIT_REPLICAS:2}

# Postgres (.env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cards_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
# MongoDB (колоды и карточки). В Docker адрес задаётся через SPRING_MONGODB_URI.
# Spring Boot 4: параметры подключения находятся в spring.mongodb.*, а не spring.data.mongodb.*.
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/cards}
# Индексы из @Indexed создаются при старте.
spring.data.mongodb.auto-index-creation=true

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://backend-ssnagin.ssngn.ru}
app.jwt.secret = ${JWT_SECRET}

# LOGGING

spring.output.ansi.enabled=DETECT

# LOGGING
logging.level.root=INFO
logging.level.com.cards=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.file.name=logs/67-cards.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14