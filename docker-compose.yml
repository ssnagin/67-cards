services:
  redis-db:
    image: redis:8.10.1-alpine
    container_name: redis_container

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgresql:
    image: postgres:18.6-alpine3.24
    container_name: postgres_container

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    env_file:
      - credentials.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in credentials.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in credentials.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in credentials.env}

    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Колоды и карточки хранятся в MongoDB (см. application.properties).
  mongo:
    image: mongo:8
    container_name: mongo_container

    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 67cards_backend
    ports:
      - "127.0.0.1:16768:8080"

    env_file:
      - credentials.env

    depends_on:
      redis-db:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      # Внутри сети Compose используются порты контейнеров, а не хоста.
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in credentials.env (base64 of at least 32 random bytes)}
      SPRING_DATA_REDIS_HOST: redis-db
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MONGODB_URI: mongodb://mongo:27017/cards
    restart: on-failure

